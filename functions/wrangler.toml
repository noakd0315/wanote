name = "wanote-functions"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Set with: wrangler secret put ANTHROPIC_API_KEY
# Set with: wrangler secret put FIREBASE_PROJECT_ID
[vars]
# Non-secret config only. Secrets (ANTHROPIC_API_KEY, FIREBASE_PROJECT_ID)
# must be set via `wrangler secret put` — never committed here.

# Used by src/lib/rateLimiter.ts (Agent D's /ai/consultation and /ai/report
# routes; Agent C's /ocr/certificate route may bind the same namespace).
# Create the real namespace with:
#   wrangler kv namespace create RATE_LIMIT_KV
# then replace the placeholder id below with the id it prints. Left
# uncreated for now since this worktree cannot deploy/provision Cloudflare
# resources — see this feature's agent report.
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
