name = "wanote-functions"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Set with: wrangler secret put ANTHROPIC_API_KEY
# Set with: wrangler secret put FIREBASE_PROJECT_ID
[vars]
# Non-secret config only. Secrets (ANTHROPIC_API_KEY, FIREBASE_PROJECT_ID)
# must be set via `wrangler secret put` — never committed here.

# Per-user rate limiting (src/lib/rateLimiter.ts), used by every route that
# spends money: the AI consultation/report routes, OCR, and the billing
# routes' abuse ceilings.
#
# A Durable Object rather than KV: the limit has to be a hard ceiling, and a
# KV read-compare-write is neither atomic nor read-your-writes consistent, so
# concurrent or multi-region traffic sailed past it. `wrangler dev` simulates
# Durable Objects locally, so no Cloudflare resource is needed for local dev.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# Required for Cloudflare to create the class on first deploy. Do not renumber
# an applied tag -- add a new one instead.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]
