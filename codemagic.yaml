# Codemagic CI configuration.
#
# Why this exists: `flutter build ipa` requires Xcode, which does not run on
# Windows. Rather than buy a Mac, iOS builds happen on Codemagic's macOS
# machines, which also hold the signing certificates.
#
# Two workflows, deliberately split:
#
#   verify  -- analyze, test, and an Android build. Needs no accounts, no
#              signing, no secrets. Usable the moment the repository is
#              connected.
#   ios     -- builds and ships to TestFlight. Needs an Apple Developer
#              Program membership and an App Store Connect API key, so it
#              stays unusable until those exist.
#
# Keeping them apart means CI is useful before Apple approval, instead of
# being one all-or-nothing pipeline that fails on every commit until the
# store paperwork clears.
#
# See docs/CODEMAGIC_SETUP.md for what has to be configured on their side.

definitions:
  flutter_version: &flutter_version 3.44.8

workflows:

  verify:
    name: Analyze, test and build Android
    # No instance_type on purpose. Naming one (linux_x2) was rejected with
    # "The selected instance type is not available with the current billing
    # plan" -- the free plan does not offer every machine. Leaving it out
    # lets Codemagic pick whatever the plan allows, and nothing here needs a
    # particular one: analyze, tests and an Android build run anywhere.
    max_build_duration: 30
    environment:
      flutter: *flutter_version
    # No `push`. Every push started a build and every build is paid for
    # (PM, 2026-08-21). analyze and the full test suite are run locally
    # before each commit, so this workflow only ever confirmed what was
    # already known -- and this repo is worked on by pushing straight to
    # main, so "every push" meant "every commit".
    #
    # Still available by hand from Codemagic, and still runs on a pull
    # request if the workflow ever changes.
    triggering:
      events:
        - pull_request
      cancel_previous_builds: true
    # Sibling of `triggering`, not a child of it -- nesting it there is
    # rejected with "extra fields not permitted".
    #
    # Documentation cannot break the analyzer, the tests or the Android
    # build, so building it is pure cost. Most of this repo's commits are
    # docs -- the store/RevenueCat setup notes are large and change often --
    # and they are what exhausted the free build minutes on 2026-08-20.
    #
    # codemagic.yaml itself is always in the changeset regardless, so a
    # change to this file still triggers a build.
    when:
      changeset:
        includes:
          - '.'
        excludes:
          - 'docs/'
          - '**/*.md'
    scripts:
      - name: Fetch packages
        script: flutter pub get

      # firebase_options.dart is generated by `flutterfire configure` and is
      # gitignored, so a fresh clone cannot compile main.dart. The tests do
      # not touch it, but the analyzer does -- so CI writes a placeholder
      # that satisfies the import without pointing at any real project.
      #
      # Deliberately not the real config: CI has no business holding it, and
      # a placeholder that fails loudly at runtime is safer than one that
      # quietly connects somewhere.
      - name: Stub the generated Firebase options
        script: |
          if [ ! -f lib/firebase_options.dart ]; then
            cat > lib/firebase_options.dart <<'DART'
          // Generated placeholder for CI only. The real file comes from
          // `flutterfire configure` and is gitignored.
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => throw UnsupportedError(
              'firebase_options.dart is a CI placeholder. Run '
              '`flutterfire configure` to generate the real one.',
            );
          }
          DART
          fi

      - name: Analyze
        script: flutter analyze

      - name: Test
        script: flutter test

      # The google-services gradle plugin refuses to build without this
      # file, and it is gitignored like the rest of the Firebase config.
      # A placeholder is enough: nothing here is ever run, only compiled.
      - name: Stub google-services.json
        script: |
          if [ ! -f android/app/google-services.json ]; then
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "jp.wanote.app" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyCI00000000000000000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      # The step that would have caught the broken AndroidManifest.xml.
      # analyze, the tests and the web build never parse that file; only an
      # Android build does.
      #
      # Debug, not release: this is a compile check, and the release signing
      # key is not present in CI (nor should it be).
      #
      # Only when something Android-specific moved. This is by far the
      # longest step in the workflow, and build minutes are paid for
      # (PM, 2026-08-21). A change under lib/ cannot break the manifest, and
      # the release APK/AAB is built locally on every delivery anyway -- so
      # the one thing this catches is already covered for everything except
      # a change to the Android project itself.
      - name: Build Android
        script: flutter build apk --debug
        when:
          changeset:
            includes:
              - 'android/'
              - 'pubspec.yaml'

  ios:
    name: iOS build to TestFlight
    # macOS is not a preference here, it is a requirement: only a Mac can
    # run Xcode. If the plan rejects this one, the fix is a different macOS
    # instance, never a Linux one.
    instance_type: mac_mini_m2
    max_build_duration: 60
    # No triggering section: this runs only when started by hand. Every run
    # costs macOS build minutes, and until the signing setup below exists it
    # can only fail.
    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        # Configure in Codemagic: Teams > ... > Environment variables.
        # Holds APP_STORE_CONNECT_* and the base64 GoogleService-Info.plist.
        # See docs/CODEMAGIC_SETUP.md.
        - wanote_ios
      vars:
        BUNDLE_ID: jp.wanote.app
        # Needed to ask App Store Connect what it already has -- see the
        # build-number step below.
        APP_STORE_APP_ID: 6802021501
      # No `ios_signing:` block, deliberately.
      #
      # That block turns on Codemagic's automatic signing, which looks up
      # existing profiles through the App Store Connect integration and
      # fails when there are none -- "No matching profiles found for bundle
      # identifier jp.wanote.app and distribution type app_store". It never
      # creates them, so a brand-new account can never get past it, and it
      # runs during environment setup, before any script could help.
      #
      # The "Set up signing" step below does the same job with --create.
    scripts:
      - name: Fetch packages
        script: flutter pub get

      # Windows cannot register this file in the Xcode project, so it is not
      # in the repository (and should not be: it is per-project config). CI
      # restores it from an environment variable instead.
      - name: Restore GoogleService-Info.plist
        script: |
          # Checked rather than assumed. `echo $UNSET | base64 --decode`
          # exits 0 and writes an empty file, so a missing variable used to
          # sail through this step and surface much later as something that
          # looked like a code problem.
          [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ] || {
            echo "GOOGLE_SERVICE_INFO_PLIST_BASE64 is not set. Add it to the wanote_ios variable group."
            exit 1
          }
          echo $GOOGLE_SERVICE_INFO_PLIST_BASE64 | base64 --decode > ios/Runner/GoogleService-Info.plist

      # Google sign-in comes back to the app through a custom URL scheme,
      # and iOS only hands it over if Info.plist declares that exact scheme.
      # The scheme is REVERSED_CLIENT_ID from GoogleService-Info.plist --
      # which the step above just replaced with the real project's file,
      # while Info.plist still carried the value hand-copied from whatever
      # placeholder was in the repository. When the two disagree, Apple
      # never returns and sign-in fails on iOS only; Android uses a
      # different mechanism and is unaffected, which is exactly the split
      # the PM reported (2026-08-18).
      #
      # So it is derived here rather than maintained by hand: the file that
      # defines the scheme is the file it is read from, and the two cannot
      # drift apart again.
      - name: Register the Google sign-in client id and URL scheme
        script: |
          CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :CLIENT_ID" ios/Runner/GoogleService-Info.plist)
          REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/Runner/GoogleService-Info.plist)
          [ -n "$CLIENT_ID" ] && [ -n "$REVERSED_CLIENT_ID" ] || {
            echo "GoogleService-Info.plist is missing CLIENT_ID or REVERSED_CLIENT_ID. Is GOOGLE_SERVICE_INFO_PLIST_BASE64 the iOS app's plist?"
            exit 1
          }
          # Two separate things, and the app needs both: GIDClientID is who
          # is asking, CFBundleURLSchemes is where the answer comes back.
          /usr/libexec/PlistBuddy -c "Set :GIDClientID $CLIENT_ID" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $REVERSED_CLIENT_ID" ios/Runner/Info.plist
          echo "GIDClientID set to $CLIENT_ID"
          echo "URL scheme set to $REVERSED_CLIENT_ID"

      - name: Restore firebase_options.dart
        script: |
          [ -n "$FIREBASE_OPTIONS_DART_BASE64" ] || {
            echo "FIREBASE_OPTIONS_DART_BASE64 is not set. Add it to the wanote_ios variable group."
            exit 1
          }
          echo $FIREBASE_OPTIONS_DART_BASE64 | base64 --decode > lib/firebase_options.dart

      # Same reason as the two files above: config/prod.json is gitignored,
      # so CI has no copy of it and the build died with "Did not find the
      # file passed to --dart-define-from-file".
      #
      # Nothing in it is secret -- the file's own header says so, and every
      # value is compiled into the shipped binary anyway. It is kept out of
      # the repository because it is per-deployment configuration, not
      # because it is sensitive.
      - name: Restore config/prod.json
        script: |
          [ -n "$PROD_JSON_BASE64" ] || {
            echo "PROD_JSON_BASE64 is not set. Add it to the wanote_ios variable group."
            exit 1
          }
          mkdir -p config
          echo $PROD_JSON_BASE64 | base64 --decode > config/prod.json

      # Fetches the signing files, creating them if the account has none
      # yet -- which on a first build it does not.
      #
      # `xcode-project use-profiles` alone only consumes profiles already on
      # disk, so the first build failed with "No matching profiles found for
      # bundle identifier". Nothing had put any there.
      #
      # --create is what makes this work on a fresh account: it asks App
      # Store Connect to issue the distribution certificate and provisioning
      # profile rather than expecting someone to have made them by hand.
      #
      # --certificate-key is the half that was missing. A certificate is a
      # signed public key, so issuing one needs a private key to bind it to;
      # without it the run logged "Cannot save Signing Certificates without
      # certificate private key", left the keychain empty, and the build
      # failed later with "No valid code signing certificates were found".
      #
      # The key is generated once and held in CERTIFICATE_PRIVATE_KEY, not
      # generated per build. Apple caps how many distribution certificates a
      # team may hold, and a fresh key each time would mint a new one on
      # every run until that cap stopped the builds.
      - name: Set up signing
        script: |
          [ -n "$CERTIFICATE_PRIVATE_KEY" ] || {
            echo "CERTIFICATE_PRIVATE_KEY is not set. Add it to the wanote_ios variable group."
            exit 1
          }
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID"             --type IOS_APP_STORE             --certificate-key=@env:CERTIFICATE_PRIVATE_KEY             --create
          keychain add-certificates
          xcode-project use-profiles

      # Asks App Store Connect what it already has, rather than trusting a
      # local counter.
      #
      # pubspec's build number is 1 and stays 1, so the second upload was
      # refused: "The bundle version must be higher than the previously
      # uploaded version: 1". Every later build would have hit the same wall.
      #
      # Deriving it from the store is self-correcting -- it stays right
      # through a re-run, a rebuilt CI, or a build uploaded from somewhere
      # else entirely, none of which a counter kept on this side would
      # survive.
      - name: Set the build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          echo "Latest build number on App Store Connect: $LATEST"
          echo "NEXT_BUILD_NUMBER=$((LATEST + 1))" >> $CM_ENV

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$NEXT_BUILD_NUMBER \
            --dart-define-from-file=config/prod.json \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # TestFlight, internal testers only.
    #
    # Internal testing needs no Beta App Review -- the build is available to
    # internal testers as soon as App Store Connect finishes processing it.
    # Only external testing is reviewed. That is what makes same-evening
    # device testing possible at all.
    #
    # `auth: integration` requires a matching integrations entry, and naming
    # one that does not exist makes Codemagic reject the WHOLE file, taking
    # the verify workflow down with it (that happened once already). The
    # integration must therefore be created in Codemagic under exactly this
    # name before this file is pushed.
    integrations:
      app_store_connect: wanote_asc

    publishing:
      app_store_connect:
        auth: integration
        # Uploaded, not submitted.
        #
        # submit_to_testflight sends the build to TestFlight *beta review*,
        # which is the external-testing path: it demands a feedback email,
        # a review contact, and a description of what to test, and it fails
        # the whole step without them.
        #
        # Internal testers need none of that. The build reaches them as soon
        # as App Store Connect finishes processing it, which the upload above
        # already accomplishes. Asking for review as well only produced a red
        # build for something nobody wanted (2026-08-16).
        submit_to_testflight: false
        submit_to_app_store: false
