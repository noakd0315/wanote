# Codemagic CI configuration.
#
# Why this exists: `flutter build ipa` requires Xcode, which does not run on
# Windows. Rather than buy a Mac, iOS builds happen on Codemagic's macOS
# machines, which also hold the signing certificates.
#
# Two workflows, deliberately split:
#
#   verify  -- analyze, test, and an Android build. Needs no accounts, no
#              signing, no secrets. Usable the moment the repository is
#              connected.
#   ios     -- builds and ships to TestFlight. Needs an Apple Developer
#              Program membership and an App Store Connect API key, so it
#              stays unusable until those exist.
#
# Keeping them apart means CI is useful before Apple approval, instead of
# being one all-or-nothing pipeline that fails on every commit until the
# store paperwork clears.
#
# See docs/CODEMAGIC_SETUP.md for what has to be configured on their side.

definitions:
  flutter_version: &flutter_version 3.44.8

workflows:

  verify:
    name: Analyze, test and build Android
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: *flutter_version
    triggering:
      events:
        - push
        - pull_request
    scripts:
      - name: Fetch packages
        script: flutter pub get

      # firebase_options.dart is generated by `flutterfire configure` and is
      # gitignored, so a fresh clone cannot compile main.dart. The tests do
      # not touch it, but the analyzer does -- so CI writes a placeholder
      # that satisfies the import without pointing at any real project.
      #
      # Deliberately not the real config: CI has no business holding it, and
      # a placeholder that fails loudly at runtime is safer than one that
      # quietly connects somewhere.
      - name: Stub the generated Firebase options
        script: |
          if [ ! -f lib/firebase_options.dart ]; then
            cat > lib/firebase_options.dart <<'DART'
          // Generated placeholder for CI only. The real file comes from
          // `flutterfire configure` and is gitignored.
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => throw UnsupportedError(
              'firebase_options.dart is a CI placeholder. Run '
              '`flutterfire configure` to generate the real one.',
            );
          }
          DART
          fi

      - name: Analyze
        script: flutter analyze

      - name: Test
        script: flutter test

      # The google-services gradle plugin refuses to build without this
      # file, and it is gitignored like the rest of the Firebase config.
      # A placeholder is enough: nothing here is ever run, only compiled.
      - name: Stub google-services.json
        script: |
          if [ ! -f android/app/google-services.json ]; then
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "jp.wanote.app" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyCI00000000000000000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      # The step that would have caught the broken AndroidManifest.xml.
      # analyze, the tests and the web build never parse that file; only an
      # Android build does, and none had run for days.
      #
      # Debug, not release: this is a compile check, and the release signing
      # key is not present in CI (nor should it be).
      - name: Build Android
        script: flutter build apk --debug

  ios:
    name: iOS build to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # No triggering section: this runs only when started by hand. Every run
    # costs macOS build minutes, and until the signing setup below exists it
    # can only fail.
    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        # Configure in Codemagic: Teams > ... > Environment variables.
        # Holds APP_STORE_CONNECT_* and the base64 GoogleService-Info.plist.
        # See docs/CODEMAGIC_SETUP.md.
        - wanote_ios
      vars:
        BUNDLE_ID: jp.wanote.app
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.wanote.app
    scripts:
      - name: Fetch packages
        script: flutter pub get

      # Windows cannot register this file in the Xcode project, so it is not
      # in the repository (and should not be: it is per-project config). CI
      # restores it from an environment variable instead.
      - name: Restore GoogleService-Info.plist
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST_BASE64 | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Restore firebase_options.dart
        script: |
          echo $FIREBASE_OPTIONS_DART_BASE64 | base64 --decode > lib/firebase_options.dart

      - name: Set up signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --dart-define-from-file=config/prod.json \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # TestFlight upload is deliberately absent until the App Store Connect
    # integration exists. `auth: integration` is only valid alongside a
    # matching `integrations: app_store_connect:` entry, and declaring one
    # that does not exist makes Codemagic reject the WHOLE file -- taking
    # the verify workflow down with it, which is what happened here.
    #
    # Once the integration is configured (docs/CODEMAGIC_SETUP.md B-2),
    # add both halves back together:
    #
    #     integrations:
    #       app_store_connect: <the integration name from Codemagic>
    #
    #     publishing:
    #       app_store_connect:
    #         auth: integration
    #         submit_to_testflight: true
    #         submit_to_app_store: false
    #
    # Until then the IPA is downloadable from the build artifacts above.
